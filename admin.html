<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Estoque</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase Modulares -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
</head>
<body style="background-color: #f3f4f6;">

    <!-- Tela de Login -->
    <div class="container" id="login-screen">
        <div class="admin-container" style="max-width: 400px; margin-top: 10vh;">
            <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Login Admin</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn-primary w-100">Entrar</button>
            </form>
            <p id="login-error" style="color: var(--danger); margin-top: 1rem; text-align: center; display: none;">Erro ao fazer login.</p>
        </div>
    </div>

    <!-- Painel de Administração -->
    <div class="container hidden" id="admin-panel">
        <div class="admin-container">
            <div class="admin-header">
                <h2>Gerenciar Estoque</h2>
                <button id="logout-btn" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600;">Sair</button>
            </div>

            <form id="add-product-form">
                <h3>Adicionar Novo Produto</h3>
                <br>
                <div class="form-group">
                    <label>Foto do Produto (Tire com o celular ou escolha)</label>
                    <div class="image-preview" id="image-preview-container">
                        <span style="color: var(--text-muted); font-size: 0.875rem;">Nenhuma imagem</span>
                        <img id="image-preview" style="display: none;">
                    </div>
                    <input type="file" id="product-image" accept="image/*" capture="environment" required>
                </div>

                <div class="form-group">
                    <label for="product-name">Nome do Produto</label>
                    <input type="text" id="product-name" required placeholder="Ex: Camiseta Básica">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="product-price">Preço (R$)</label>
                        <input type="number" step="0.01" id="product-price" required placeholder="0.00">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="product-stock">Qtd em Estoque</label>
                        <input type="number" id="product-stock" required placeholder="Ex: 10">
                    </div>
                </div>

                <button type="submit" class="btn-primary w-100" id="submit-product-btn">Salvar Produto</button>
            </form>

            <div class="admin-products-list">
                <h3>Produtos no Estoque</h3>
                <div id="admin-products-container" style="margin-top: 1rem;">
                    <!-- Itens listados aqui -->
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
